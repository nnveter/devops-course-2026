[defaults]
inventory = inventory/prod.ini
retry_files_enabled = False
host_key_checking = True
timeout = 15
force_handlers = True
# ansible-core 2.20 on the control node warns about INJECT_FACTS_AS_VARS for the
# ansible_* facts used in roles/base; the course targets core 2.16, so hide this noise
deprecation_warnings = False

[ssh_connection]
pipelining = True
